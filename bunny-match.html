<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4f7">
<title>消消兔 · Bunny accounting</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@600;800;900&display=swap");

:root {
  --bg:#fff5f7;
  --paper:#fffdfa;
  --ink:#563c47;
  --muted:#87717a;
  --line:#ecdce3;
  --accent:#a94f76;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.6 "Nunito","LXGW WenKai TC",
    "Microsoft JhengHei",sans-serif;
}

button,a {
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

button {
  font:inherit;
  cursor:pointer;
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 14px;
  background:var(--paper);
  color:inherit;
  min-height:43px;
}

button:disabled {
  opacity:.5;
  cursor:not-allowed;
}

button:focus-visible,a:focus-visible {
  outline:3px solid var(--accent);
  outline-offset:3px;
}

a {
  color:var(--accent);
  text-decoration:none;
}

.primary {
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

[hidden] { display:none !important; }

.wrap {
  width:min(560px,100%);
  margin:auto;
  padding:18px 14px 30px;
}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

header a { font-size:13px; }

h1 {
  font-size:31px;
  letter-spacing:-1px;
  margin:0;
}

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.level {
  font-size:18px;
  font-weight:800;
}

.tag {
  font-size:11px;
  color:var(--accent);
  background:#f5e1eb;
  padding:4px 9px;
  border-radius:8px;
}

.stats {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.stat {
  background:var(--paper);
  border:1px solid var(--line);
  padding:10px;
  border-radius:14px;
  text-align:center;
}

.stat span {
  display:block;
  font-size:11px;
  color:var(--muted);
}

.stat strong {
  display:block;
  font-size:23px;
  line-height:1.3;
}

.progress {
  height:6px;
  background:#ebdce3;
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}

.progress i {
  display:block;
  height:100%;
  background:var(--accent);
  transition:width .2s;
}

/* 三星挑戰區 */
.star-challenge {
  margin-bottom:12px;
  padding:12px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--paper);
}

.star-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.star-top strong {
  color:#ae7831;
  font-size:23px;
  letter-spacing:3px;
}

.star-top span {
  font-size:11px;
  color:var(--muted);
}

.star-track {
  height:7px;
  margin-top:7px;
  border-radius:10px;
  overflow:hidden;
  background:#eee2e7;
}

.star-track i {
  display:block;
  width:0;
  height:100%;
  background:#d5a257;
  border-radius:10px;
  transition:width .25s;
}

.star-challenge p {
  margin:8px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.star-challenge button {
  width:100%;
  margin-top:10px;
}

.mission {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--paper);
  border:1px solid var(--line);
  padding:9px 13px;
  border-radius:13px;
  margin-bottom:12px;
}

.mission .rabbit {
  width:43px;
  height:43px;
}

.mission small {
  color:var(--muted);
  font-size:11px;
}

.mission strong { font-size:14px; }

/* 棋盤 */
.board {
  position:relative;
  isolation:isolate;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
  padding:9px;
  background:#ead6e1;
  border-radius:19px;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}

.board.is-dragging { cursor:grabbing; }

.tile {
  position:relative;
  width:100%;
  aspect-ratio:1;
  min-height:0;
  padding:0;
  border:2px solid transparent;
  border-radius:12px;
  background:#fffaf4;
  display:grid;
  place-items:center;
  overflow:visible;
  transform-origin:center;
  will-change:transform;
  touch-action:none;
}

.tile svg {
  display:block;
  width:100%;
  height:100%;
  border-radius:10px;
  pointer-events:none;
}

.tile.selected {
  border-color:var(--accent);
  box-shadow:0 0 0 2px #fff8 inset;
}

.tile.hinted {
  border-color:#c18a40;
  animation:hint 1s ease-in-out infinite;
}

.tile.dragging {
  z-index:10;
  cursor:grabbing;
  filter:drop-shadow(0 5px 5px #73405725);
}

.tile.drag-neighbour { z-index:9; }

@keyframes hint {
  50% { border-color:#edc56f; }
}

.actions {
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:14px;
  flex-wrap:wrap;
}

.actions button { font-size:12px; }

.message {
  min-height:44px;
  text-align:center;
  color:var(--accent);
  font-size:13px;
  padding:13px 5px 0;
}

.help {
  font-size:11px;
  color:var(--muted);
  text-align:center;
  line-height:1.9;
}

footer {
  text-align:center;
  color:var(--muted);
  font-size:10px;
  margin-top:22px;
}

dialog {
  width:min(490px,calc(100% - 24px));
  max-height:85dvh;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:21px;
  padding:24px;
  background:var(--paper);
  color:var(--ink);
}

dialog::backdrop { background:#50334377; }

dialog h2 {
  text-align:center;
  margin:0 0 10px;
  font-size:26px;
}

dialog p {
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

.dialog-actions {
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

.levels {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  margin-top:17px;
}

.levels button {
  padding:9px 3px;
  font-weight:800;
}

.levels button small {
  display:block;
  font-size:9px;
  min-height:14px;
}

.levels .current {
  border-color:var(--accent);
  background:#fae3ec;
}

.trophy {
  font-size:39px;
  text-align:center;
  color:#ae7831;
}

/* 兔兔小表情 */
.match-ears {
  transform-box:view-box;
  transform-origin:102px 88px;
  animation:ear-wiggle 7s ease-in-out infinite;
}

.match-blink {
  transform-box:fill-box;
  transform-origin:center;
  animation:eye-blink 6s linear infinite;
}

.match-selected-heart {
  opacity:0;
  transition:opacity .15s;
}

.tile.selected .match-selected-heart,
.tile.dragging .match-selected-heart {
  opacity:1;
}

@keyframes ear-wiggle {
  0%,78%,100% { transform:rotate(0); }
  82% { transform:rotate(-3deg); }
  87% { transform:rotate(2deg); }
  92% { transform:rotate(-1deg); }
}

@keyframes eye-blink {
  0%,91%,96%,100% { transform:scaleY(1); }
  93%,94% { transform:scaleY(.08); }
}

@media(max-width:380px) {
  .wrap { padding:12px 9px 25px; }
  .board { gap:3px;padding:6px;border-radius:14px; }
  .tile { border-radius:9px; }
  .stat { padding:8px 4px; }
  .stat strong { font-size:21px; }
  h1 { font-size:27px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important;
    transition:none !important;
  }
  .tile { will-change:auto; }
}
</style>
</head>

<body>
<main class="wrap">
  <header>
    <a href="index.html">← 返回小窩</a>
    <h1>消消兔</h1>
    <button id="levelsButton" type="button">選關</button>
  </header>

  <div class="top">
    <strong class="level" id="levelLabel"></strong>
    <span class="tag" id="typeLabel"></span>
  </div>

  <section class="stats">
    <div class="stat">
      <span>分數</span><strong id="score">0</strong>
    </div>
    <div class="stat">
      <span>過關目標</span><strong id="target">0</strong>
      <div class="progress"><i id="scoreBar"></i></div>
    </div>
    <div class="stat">
      <span>剩餘步數</span><strong id="moves">0</strong>
    </div>
  </section>

  <section class="star-challenge">
    <div class="star-top">
      <strong id="challengeStars">☆☆☆</strong>
      <span id="challengeTarget"></span>
    </div>
    <div class="star-track"><i id="challengeFill"></i></div>
    <p id="challengeMessage"></p>
    <button type="button" id="finishLevelButton"
      class="primary" hidden>完成本關</button>
  </section>

  <section class="mission" id="mission"></section>

  <div class="board" id="board"
    role="group" aria-label="兔兔三消棋盤"></div>

  <div class="actions">
    <button id="hintButton" type="button">找一找</button>
    <button id="shuffleButton" type="button">重新洗牌 · 本關一次</button>
    <button id="restartButton" type="button">重玩本關</button>
  </div>

  <div class="message" id="message"
    role="status" aria-live="polite"></div>

  <p class="help">
    點兩隻相鄰兔兔，或按住拖動交換。<br>
    三隻相同兔兔連線即可消除；四連、五連和連鎖有加分。<br>
    達標後可繼續衝三星，或按「完成本關」結算。<br>
    無法消除的交換不扣步數。
  </p>

  <footer>Made by Yanice Mai</footer>
</main>

<dialog id="dialog"></dialog>

<script>
"use strict";

(() => {
  const $ = id => document.getElementById(id);
  const SIZE = 7;
  const KEY = "bunny-match-progress-v1";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  const TYPES = [
    {name:"奶油侏儒兔",breed:0,fur:"#fff7e8",bg:"#fff8e9"},
    {name:"奶茶垂耳兔",breed:1,fur:"#dfc7a4",bg:"#f8efdf"},
    {name:"可可長毛垂耳兔",breed:2,fur:"#b59a8e",bg:"#f3e7e1"},
    {name:"芝麻豆奇兔",breed:3,fur:"#77717d",bg:"#eeebf5"},
    {name:"灰色侏儒兔",breed:0,fur:"#acb6bf",bg:"#eaf1f5"},
    {name:"白色垂耳兔",breed:1,fur:"#fffaf0",bg:"#faeaf1"}
  ];

  const LEVELS = Array.from({length:50}, (_,i) => {
    const n = i + 1;
    const types = n <= 10 ? 4 : n <= 25 ? 5 : 6;

    return {
      n,
      seed:20261117 + n * 7919,
      types,
      moves:n <= 10 ? 30 : n <= 25 ? 32 : 35,
      target:1500 + i * 65,
      collectType:i % types,
      collect:n === 1 ? 0 : 8 + Math.floor(i * .36)
    };
  });

  let progress = {unlocked:1,best:{},stars:{}};

  try {
    const stored = JSON.parse(localStorage.getItem(KEY));

    if (
      stored &&
      Number.isInteger(stored.unlocked) &&
      stored.unlocked >= 1 &&
      stored.unlocked <= 50
    ) {
      progress.unlocked = stored.unlocked;

      for (let n=1;n<=50;n++) {
        const best = Number(stored.best?.[n]);
        const stars = Number(stored.stars?.[n]);

        if (Number.isFinite(best) && best >= 0) {
          progress.best[n] = Math.floor(best);
        }

        if (Number.isInteger(stars) && stars >= 1 && stars <= 3) {
          progress.stars[n] = stars;
        }
      }
    }
  } catch {}

  let level;
  let grid = [];
  let score = 0;
  let moves = 0;
  let collected = 0;
  let selected = -1;
  let busy = false;
  let finished = false;
  let usedShuffle = false;
  let random = Math.random;
  let drag = null;
  let ignoreClickUntil = 0;
  let fallOffsets = null;
  let fallingAnimations = [];

  const say = message => $("message").textContent = message;
  const delay = ms => new Promise(resolve => setTimeout(resolve,ms));

  function persist() {
    try {
      localStorage.setItem(KEY,JSON.stringify(progress));
    } catch {
      say("瀏覽器未能保存進度，今次仍可繼續遊玩。");
    }
  }

  function seeded(seed) {
    return () => {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15,1 | seed);
      t = t + Math.imul(t ^ t >>> 7,61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- 兔兔外觀與十種表情 ---------- */

  function rabbit(type, variant = type) {
    const t = TYPES[type];
    const c = t.fur;
    const ink = "#735b55";
    const cream = "#fffaf2";
    const lop = t.breed === 1 || t.breed === 2;
    const fuzzy = t.breed === 2;
    const dutch = t.breed === 3;
    const expression = ((variant * 7 + type * 3) % 10 + 10) % 10;

    const openEyes = `
      <ellipse cx="83" cy="110" rx="5" ry="7" fill="#49332f"/>
      <ellipse cx="121" cy="110" rx="5" ry="7" fill="#49332f"/>
      <ellipse cx="84.4" cy="107.7" rx="1.8" ry="2.2" fill="white"/>
      <ellipse cx="122.4" cy="107.7" rx="1.8" ry="2.2" fill="white"/>
      <circle cx="81.5" cy="113" r=".9" fill="white"/>
      <circle cx="119.5" cy="113" r=".9" fill="white"/>
    `;

    const smiling = '<path d="M76 112q7-12 14 0m24 0q7-12 14 0"/>';
    const closed = '<path d="M76 110q7 7 14 0m24 0q7 7 14 0"/>';

    const heart = (x,y) => `
      <path d="M${x} ${y+7}l-7-7a4.2 4.2 0 0 1 7-5
        a4.2 4.2 0 0 1 7 5Z"
        fill="#cf648b" stroke="none"/>
    `;

    const faces = [
      {
        eyes:openEyes,
        mouth:'<path d="M95 132q7 9 14 0"/>',
        extra:'<path d="m145 89 2-5 2 5 5 2-5 2-2 5-2-5-5-2Z" fill="#d9af65" stroke="none"/>'
      },
      {
        eyes:smiling,
        mouth:'<path d="M94 129q8 19 16 0Z" fill="#ae6c7d"/><path d="M98 136q4-3 8 0" stroke="#efb2bd"/>'
      },
      {
        eyes:'<path d="M76 111q7-11 14 0"/><ellipse cx="121" cy="110" rx="5" ry="7" fill="#49332f" stroke="none"/><ellipse cx="122.5" cy="108" rx="1.7" ry="2" fill="white" stroke="none"/>',
        mouth:'<path d="M95 132q7 8 14-1"/>',
        extra:heart(144,108)
      },
      {
        eyes:closed,
        mouth:'<path d="M98 133q4 4 8 0"/>',
        extra:'<path d="m66 124-2 5m7-4-2 5m65-6-2 5m7-4-2 5" stroke="#c77e96" stroke-width="1.4"/>'
      },
      {
        eyes:openEyes,
        mouth:'<ellipse cx="102" cy="134" rx="4" ry="5" fill="#ad7181" stroke="none"/>'
      },
      {
        eyes:heart(83,108)+heart(121,108),
        mouth:'<path d="M94 130q8 16 16 0Z" fill="#b87589"/>',
        extra:heart(144,86)
      },
      {
        eyes:'<path d="M77 110h12m26 0h12"/><path d="m77 101 11 3m28 0 11-3" stroke-width="1.6"/>',
        mouth:'<path d="M97 134q5-5 10 0"/>'
      },
      {
        eyes:smiling,
        mouth:'<path d="M94 130q8 8 16 0"/><path d="M100 133h7v6q-3.5 7-7 0Z" fill="#e8a2b2" stroke-width="1.2"/><path d="M103.5 135v4" stroke="#c37b90" stroke-width="1"/>'
      },
      {
        eyes:'<path d="M76 112q7 3 14 0m24 0q7 3 14 0"/>',
        mouth:'<ellipse cx="102" cy="134" rx="3" ry="2" fill="#ad7181" stroke="none"/>',
        extra:'<text x="141" y="94" fill="#a48aaa" stroke="none" font-size="17" font-family="Nunito,sans-serif">z</text>'
      },
      {
        eyes:'<path d="m77 104 10 7-10 6m50-13-10 7 10 6"/>',
        mouth:'<path d="M92 129q10 23 20 0Z" fill="#ae6c7d"/><path d="M98 140q4-4 8 0" stroke="#efb2bd" stroke-width="3"/>'
      }
    ];

    const face = faces[expression];

    return `
      <svg class="rabbit match-rabbit" viewBox="25 0 180 208"
        aria-hidden="true">
        <rect x="25" width="180" height="208" fill="${t.bg}"/>
        <ellipse cx="117" cy="191" rx="56" ry="6"
          fill="#bba9a3" opacity=".12"/>
        <circle cx="173" cy="156" r="14"
          fill="${cream}" stroke="${ink}" stroke-width="2"/>
        <ellipse cx="119" cy="155" rx="48" ry="35"
          fill="${c}" stroke="${ink}" stroke-width="2"/>

        ${dutch ? `<path d="M93 123q18-6 29 1l7 64q-20 5-35-4Z"
          fill="${cream}"/>` : ""}

        <ellipse cx="88" cy="187" rx="20" ry="7"
          fill="${dutch?cream:c}" stroke="${ink}" stroke-width="2"/>
        <ellipse cx="140" cy="187" rx="21" ry="7"
          fill="${c}" stroke="${ink}" stroke-width="2"/>

        ${!lop ? `
          <g class="match-ears" style="animation-delay:${-(variant*.63%5)}s">
            <path d="M78 88Q58 15 75 10Q92 8 96 85
              M111 85Q114 10 131 13Q147 17 129 93"
              fill="${c}" stroke="${ink}" stroke-width="2"/>
            <path d="M79 66Q69 21 77 24l9 43
              M120 68q5-45 13-42l-6 45" fill="#e6b7c5"/>
          </g>` : ""}

        ${fuzzy ? `
          <path d="m65 95-11 13 7 8-8 13 11 5-5 15
            14 1 1 13 16-4 8 10 13-8 12 7 9-12 16 3
            1-14 12-5-7-13 7-11-11-8 2-13-14 1
            -5-11-13 6-9-8-11 8-13-5-5 11Z"
            fill="${c}" stroke="${ink}" stroke-width="1.7"/>` : ""}

        <ellipse cx="102" cy="113" rx="43" ry="37"
          fill="${c}" stroke="${ink}" stroke-width="2"/>

        ${dutch ? `
          <path d="m102 76-13 36q-9 19-1 32
            14 9 29-1 6-15-3-31Z" fill="${cream}"/>` : ""}

        ${lop ? `
          <g class="match-ears" style="animation-delay:${-(variant*.63%5)}s">
            <path d="M67 85Q40 83 43 117l4 30q4 16 15 5l15-46
              M136 84q23 4 20 36l-7 30q-5 13-14 1l-10-44"
              fill="${c}" stroke="${ink}" stroke-width="2"/>
            <path d="M55 102q-5 19 1 35m86-35q6 20-1 36"
              stroke="#deb0bd" stroke-width="6"
              fill="none" stroke-linecap="round"/>
          </g>` : ""}

        ${fuzzy ? `
          <path d="m72 89 7-11 7 6 9-10 8 7 10-6 6 10 10-2"
            fill="${c}" stroke="${ink}" stroke-width="1.6"/>` : ""}

        <ellipse cx="74" cy="125" rx="10" ry="5"
          fill="#ea9eb5" opacity="${expression===3?.85:.55}"/>
        <ellipse cx="130" cy="125" rx="10" ry="5"
          fill="#ea9eb5" opacity="${expression===3?.85:.55}"/>

        <g fill="none" stroke="${ink}" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <g class="${[0,4].includes(expression)?"match-blink":""}"
            style="animation-delay:${-(variant*1.37%7)}s">
            ${face.eyes}
          </g>
          <path d="M98 121q4-3 8 0l-4 4Z"
            fill="#b97c8e" stroke="none"/>
          ${face.mouth}${face.extra||""}
        </g>

        <g class="match-selected-heart" fill="#d57798">
          <path d="M148 67l-7-7a4.2 4.2 0 0 1 7-5
            a4.2 4.2 0 0 1 7 5Z"/>
        </g>
      </svg>
    `;
  }

  /* ---------- 三消邏輯 ---------- */

  function adjacent(a,b) {
    return Math.abs(Math.floor(a/SIZE)-Math.floor(b/SIZE))+
      Math.abs(a%SIZE-b%SIZE)===1;
  }

  function swap(board,a,b) {
    [board[a],board[b]]=[board[b],board[a]];
  }

  function matches(board) {
    const found = new Set();
    const groups = [];

    function scan(indices) {
      let start = 0;

      while (start < indices.length) {
        let end = start+1;
        const value = board[indices[start]];

        while (
          end < indices.length &&
          board[indices[end]] === value
        ) end++;

        if (value >= 0 && end-start >= 3) {
          const group = indices.slice(start,end);
          groups.push(group);
          group.forEach(index=>found.add(index));
        }

        start=end;
      }
    }

    for (let r=0;r<SIZE;r++) {
      scan(Array.from({length:SIZE},(_,c)=>r*SIZE+c));
    }

    for (let c=0;c<SIZE;c++) {
      scan(Array.from({length:SIZE},(_,r)=>r*SIZE+c));
    }

    return {found,groups};
  }

  function legalMove(board) {
    for (let i=0;i<board.length;i++) {
      for (const j of [i+1,i+SIZE]) {
        if (j>=board.length || !adjacent(i,j)) continue;

        swap(board,i,j);
        const valid = matches(board).found.size>0;
        swap(board,i,j);

        if (valid) return [i,j];
      }
    }

    return null;
  }

  function generate() {
    for (let attempt=0;attempt<300;attempt++) {
      const board=[];

      for (let r=0;r<SIZE;r++) {
        for (let c=0;c<SIZE;c++) {
          const allowed=[];

          for (let type=0;type<level.types;type++) {
            if (
              c>=2 &&
              board[r*SIZE+c-1]===type &&
              board[r*SIZE+c-2]===type
            ) continue;

            if (
              r>=2 &&
              board[(r-1)*SIZE+c]===type &&
              board[(r-2)*SIZE+c]===type
            ) continue;

            allowed.push(type);
          }

          board.push(allowed[Math.floor(random()*allowed.length)]);
        }
      }

      if (legalMove(board)) return board;
    }

    throw Error("無法建立棋盤");
  }

  /* ---------- 格子及動畫 ---------- */

  const tileAt = index =>
    $("board").querySelector(`[data-cell="${index}"]`);

  function tilePitch() {
    const a=tileAt(0);
    const b=tileAt(1);
    if (!a || !b) return 50;
    return b.getBoundingClientRect().left-a.getBoundingClientRect().left;
  }

  function waitAnimation(animation) {
    return animation.finished.catch(()=>{});
  }

  function renderBoard(arriving=false) {
    const board=$("board");
    board.setAttribute("aria-busy",String(busy));

    if (board.children.length!==SIZE*SIZE) {
      board.replaceChildren();

      for (let i=0;i<SIZE*SIZE;i++) {
        const button=document.createElement("button");
        button.type="button";
        button.className="tile";
        button.dataset.cell=i;
        board.append(button);
      }
    }

    const pitch=tilePitch();
    fallingAnimations=[];

    grid.forEach((type,index)=>{
      const button=tileAt(index);

      button.getAnimations().forEach(animation=>animation.cancel());
      button.style.transform="";
      button.style.zIndex="";
      button.className="tile";
      button.classList.toggle("selected",selected===index);

      button.setAttribute(
        "aria-label",
        `第${Math.floor(index/SIZE)+1}行，第${index%SIZE+1}格，${TYPES[type].name}`
      );

      button.setAttribute("aria-pressed",String(selected===index));

      if (button.dataset.type!==String(type)) {
        button.innerHTML=rabbit(type,index);
        button.dataset.type=String(type);
      }

      const rows=arriving ? fallOffsets?.[index]||0 : 0;

      if (rows>0 && !reduced.matches) {
        const animation=button.animate(
          [
            {
              transform:`translateY(${-rows*pitch}px)`,
              opacity:.7
            },
            {
              transform:"translateY(3px)",
              opacity:1,
              offset:.86
            },
            {
              transform:"translateY(0)",
              opacity:1
            }
          ],
          {
            duration:Math.min(460,230+rows*35),
            easing:"cubic-bezier(.22,.65,.35,1)",
            fill:"backwards"
          }
        );

        fallingAnimations.push(waitAnimation(animation));
      }
    });

    fallOffsets=null;
  }

  async function slideTile(element,x,y,duration=170) {
    if (!element) return;

    const end=`translate(${x}px,${y}px)`;

    if (reduced.matches) {
      element.style.transform=end;
      return;
    }

    const start=getComputedStyle(element).transform;
    const animation=element.animate(
      [
        {transform:start==="none"?"translate(0,0)":start},
        {transform:end}
      ],
      {
        duration,
        easing:"cubic-bezier(.2,.75,.25,1)",
        fill:"forwards"
      }
    );

    await waitAnimation(animation);
    element.style.transform=end;
    animation.cancel();
  }

  async function animateSwap(a,b) {
    const pitch=tilePitch();
    const x=(b%SIZE-a%SIZE)*pitch;
    const y=(Math.floor(b/SIZE)-Math.floor(a/SIZE))*pitch;

    tileAt(a).style.zIndex="10";
    tileAt(b).style.zIndex="9";

    await Promise.all([
      slideTile(tileAt(a),x,y),
      slideTile(tileAt(b),-x,-y)
    ]);
  }

  async function returnTiles(indices) {
    await Promise.all([...new Set(indices)].map(index=>
      slideTile(tileAt(index),0,0,160)
    ));

    indices.forEach(index=>{
      const tile=tileAt(index);
      tile.classList.remove("dragging","drag-neighbour");
      tile.style.zIndex="";
    });
  }

  function collapseBoard() {
    const offsets=Array(SIZE*SIZE).fill(0);

    for (let c=0;c<SIZE;c++) {
      const survivors=[];

      for (let r=SIZE-1;r>=0;r--) {
        const value=grid[r*SIZE+c];
        if (value>=0) survivors.push({value,oldRow:r});
      }

      const missing=SIZE-survivors.length;

      for (let r=SIZE-1;r>=0;r--) {
        const index=r*SIZE+c;

        if (survivors.length) {
          const item=survivors.shift();
          grid[index]=item.value;
          offsets[index]=r-item.oldRow;
        } else {
          grid[index]=Math.floor(random()*level.types);
          offsets[index]=missing;
        }
      }
    }

    fallOffsets=offsets;
  }

  /* ---------- 星級及介面 ---------- */

  function goalsComplete() {
    return score>=level.target && collected>=level.collect;
  }

  function scoreStars() {
    if (score>=Math.ceil(level.target*1.5)) return 3;
    if (score>=Math.ceil(level.target*1.2)) return 2;
    if (score>=level.target) return 1;
    return 0;
  }

  function updateStarChallenge() {
    const two=Math.ceil(level.target*1.2);
    const three=Math.ceil(level.target*1.5);
    const stars=scoreStars();
    const complete=goalsComplete();

    $("challengeStars").textContent=
      "★".repeat(stars)+"☆".repeat(3-stars);

    $("challengeTarget").textContent=
      `三星 ${three.toLocaleString()} 分`;

    $("challengeFill").style.width=
      Math.min(100,score/three*100)+"%";

    if (complete && score>=three) {
      $("challengeMessage").textContent="三星及收集目標全部完成！";
    } else if (complete) {
      $("challengeMessage").textContent=
        `已達標！距離三星還差 ${(three-score).toLocaleString()} 分。`+
        `可繼續挑戰，或按「完成本關」結算。`;
    } else if (score>=level.target) {
      $("challengeMessage").textContent=
        "分數已達標，完成兔兔收集任務後才能過關。";
    } else {
      $("challengeMessage").textContent=
        `一星 ${level.target.toLocaleString()} · `+
        `二星 ${two.toLocaleString()} · 三星 ${three.toLocaleString()}`;
    }

    $("finishLevelButton").hidden=!complete||finished;
    $("finishLevelButton").disabled=busy||Boolean(drag)||finished;
  }

  function updateUI() {
    $("levelLabel").textContent=`第 ${level.n} / 50 關`;
    $("typeLabel").textContent=`${level.types} 種兔兔`;
    $("score").textContent=score;
    $("target").textContent=level.target;
    $("moves").textContent=moves;
    $("scoreBar").style.width=Math.min(100,score/level.target*100)+"%";

    if (level.collect) {
      $("mission").innerHTML=`
        <div style="display:flex;align-items:center;gap:9px">
          ${rabbit(level.collectType)}
          <div><small>本關收集</small><br>
            <strong>${TYPES[level.collectType].name}</strong>
          </div>
        </div>
        <strong>${Math.min(collected,level.collect)} / ${level.collect}</strong>
      `;
    } else {
      $("mission").innerHTML=`
        <div><strong>新手暖身關</strong><br>
          <small>達到目標分數即可過關，繼續挑戰可以拿三星。</small>
        </div>
      `;
    }

    const blocked=busy||Boolean(drag);

    $("hintButton").disabled=blocked||finished;
    $("shuffleButton").disabled=blocked||finished||usedShuffle;
    $("restartButton").disabled=blocked;
    $("levelsButton").disabled=blocked;

    // 修正：每次分數、步數變動都更新三星介面。
    updateStarChallenge();
  }

  function loadLevel(n) {
    level=LEVELS[Math.max(0,Math.min(49,n-1))];
    random=seeded(level.seed);
    score=0;
    moves=level.moves;
    collected=0;
    selected=-1;
    busy=false;
    finished=false;
    usedShuffle=false;
    drag=null;
    fallOffsets=null;

    $("board").classList.remove("is-dragging");
    grid=generate();
    renderBoard();
    updateUI();

    say(level.n===1
      ? "兔兔排好隊喇～連埋三隻一樣嘅兔兔，試下衝三星！"
      : "先睇清楚收集目標，再慢慢交換呀～");
  }

  async function reshuffle(automatic=false) {
    let candidate;
    let success=false;

    for (let attempt=0;attempt<250;attempt++) {
      candidate=[...grid];

      for (let i=candidate.length-1;i>0;i--) {
        const j=Math.floor(random()*(i+1));
        [candidate[i],candidate[j]]=[candidate[j],candidate[i]];
      }

      if (!matches(candidate).found.size && legalMove(candidate)) {
        success=true;
        break;
      }
    }

    grid=success?candidate:generate();
    selected=-1;
    renderBoard();

    say(automatic
      ? "兔兔冇路行喇，自動重新排隊，唔扣步數～"
      : "兔兔重新排好隊喇！");

    await delay(reduced.matches?0:180);
  }

  function finish(win) {
    if (finished) return;

    finished=true;
    busy=false;
    selected=-1;
    renderBoard();
    updateUI();

    if (win) {
      const stars=Math.max(1,scoreStars());

      progress.best[level.n]=Math.max(progress.best[level.n]||0,score);
      progress.stars[level.n]=Math.max(progress.stars[level.n]||0,stars);
      progress.unlocked=Math.max(
        progress.unlocked,Math.min(50,level.n+1)
      );

      persist();

      $("dialog").innerHTML=`
        <div class="trophy">${"★".repeat(stars)}</div>
        <h2>${level.n===50?"第五十關完成！":"過關喇！"}</h2>
        <p>第 ${level.n} 關 · ${score.toLocaleString()} 分<br>
          ${"★".repeat(stars)}${"☆".repeat(3-stars)}
        </p>
        <p>${stars===3
          ? "三星收好！兔兔開心到跳起～"
          : "成績收好喇！之後可以返嚟再挑戰三星。"}</p>
        <div class="dialog-actions">
          ${level.n<50
            ? '<button class="primary" data-next>下一關</button>'
            : '<button class="primary" data-level-menu>選擇關卡</button>'}
          <button data-retry>重玩本關</button>
          <a href="index.html">返回小窩</a>
        </div>
      `;
    } else {
      $("dialog").innerHTML=`
        <div class="trophy">…</div>
        <h2>差少少呀！</h2>
        <p>分數 ${score.toLocaleString()} / ${level.target.toLocaleString()}
          ${level.collect
            ? `<br>收集 ${Math.min(collected,level.collect)} / ${level.collect}`
            : ""}
        </p>
        <p>拍拍兔毛，再試一次？</p>
        <div class="dialog-actions">
          <button class="primary" data-retry>再試一次</button>
          <button data-level-menu>選關</button>
          <a href="index.html">返回小窩</a>
        </div>
      `;
    }

    $("dialog").showModal();
  }

  /* ---------- 交換、消除、結算 ---------- */

  async function attempt(a,b) {
    if (busy||finished||!adjacent(a,b)) return;

    busy=true;
    selected=-1;
    $("board").classList.remove("is-dragging");
    updateUI();

    try {
      await animateSwap(a,b);
      swap(grid,a,b);

      let result=matches(grid);

      if (!result.found.size) {
        renderBoard();
        await delay(reduced.matches?0:50);
        await animateSwap(a,b);
        swap(grid,a,b);
        renderBoard();

        say("未連成三隻，兔兔滑返原位喇～唔扣步數。");
        busy=false;
        updateUI();
        return;
      }

      moves--;
      renderBoard();

      let chain=0;

      while (result.found.size) {
        chain++;

        const multiplier=1+Math.min(chain-1,5)*.25;
        const bonus=result.groups.reduce(
          (value,group)=>value+Math.max(0,group.length-3)*40,0
        );

        score+=Math.round(
          (result.found.size*30+bonus)*multiplier
        );

        const animations=[];

        result.found.forEach(index=>{
          if (grid[index]===level.collectType) collected++;

          if (!reduced.matches) {
            const animation=tileAt(index).animate(
              [
                {transform:"scale(1)",opacity:1},
                {transform:"scale(1.12)",opacity:1,offset:.3},
                {transform:"scale(.25)",opacity:0}
              ],
              {duration:220,easing:"ease-in",fill:"forwards"}
            );

            animations.push(waitAnimation(animation));
          }
        });

        say(chain>1
          ? `連鎖 ${chain}！兔兔一隻接一隻跳落嚟～`
          : "啵！連埋一齊，消走喇～");

        updateUI();
        await Promise.all(animations);

        result.found.forEach(index=>grid[index]=-1);
        collapseBoard();
        renderBoard(true);

        await Promise.all(fallingAnimations);
        result=matches(grid);

        if (chain>=40 && result.found.size) {
          grid=generate();
          renderBoard();
          break;
        }
      }

      /*
       * 先算完整次連鎖，再判定過關。
       * 不會在連鎖中途截斷分數。
       */
      if (goalsComplete() && scoreStars()===3) {
        finish(true);
        return;
      }

      if (moves<=0) {
        finish(goalsComplete());
        return;
      }

      if (!legalMove(grid)) {
        await reshuffle(true);
      }

      busy=false;
      updateUI();

      if (goalsComplete()) {
        say("已經達標喇！繼續衝三星，或者按「完成本關」結算～");
      }

    } catch (error) {
      console.error("交換或消除：",error);
      busy=false;
      selected=-1;
      grid=generate();
      renderBoard();

      if (moves<=0) {
        finish(goalsComplete());
      } else {
        updateUI();
        say("兔兔重新排好隊喇，請繼續。");
      }
    }
  }

  function choose(index) {
    if (busy||finished) return;

    document.querySelectorAll(".hinted")
      .forEach(element=>element.classList.remove("hinted"));

    if (selected===index) {
      selected=-1;
      renderBoard();
      return;
    }

    if (selected>=0 && adjacent(selected,index)) {
      attempt(selected,index);
      return;
    }

    selected=index;
    renderBoard();
  }

  /* ---------- 跟手拖動 ---------- */

  $("board").addEventListener("pointerdown",event=>{
    if (!event.isPrimary||event.button!==0||busy||finished||drag) return;

    const cell=event.target.closest("[data-cell]");
    if (!cell) return;

    document.querySelectorAll(".hinted")
      .forEach(element=>element.classList.remove("hinted"));

    drag={
      id:event.pointerId,
      index:Number(cell.dataset.cell),
      x:event.clientX,
      y:event.clientY,
      axis:null,
      neighbour:null,
      offset:0,
      moved:false
    };

    updateUI();

    try {
      $("board").setPointerCapture(event.pointerId);
    } catch {}
  });

  $("board").addEventListener("pointermove",event=>{
    if (!drag||drag.id!==event.pointerId||busy) return;

    const dx=event.clientX-drag.x;
    const dy=event.clientY-drag.y;

    if (!drag.axis) {
      if (Math.max(Math.abs(dx),Math.abs(dy))<6) return;

      drag.axis=Math.abs(dx)>=Math.abs(dy)?"x":"y";
      drag.moved=true;
      $("board").classList.add("is-dragging");
      tileAt(drag.index).classList.add("dragging");
    }

    event.preventDefault();

    const pitch=tilePitch();
    const raw=drag.axis==="x"?dx:dy;
    const row=Math.floor(drag.index/SIZE);
    const col=drag.index%SIZE;

    const nextRow=row+(drag.axis==="y"?Math.sign(raw):0);
    const nextCol=col+(drag.axis==="x"?Math.sign(raw):0);

    const valid=raw!==0 &&
      nextRow>=0 && nextRow<SIZE &&
      nextCol>=0 && nextCol<SIZE;

    const neighbour=valid?nextRow*SIZE+nextCol:null;

    if (drag.neighbour!==null && drag.neighbour!==neighbour) {
      const old=tileAt(drag.neighbour);
      old.style.transform="";
      old.classList.remove("drag-neighbour");
    }

    drag.neighbour=neighbour;
    drag.offset=valid
      ? Math.max(-pitch,Math.min(pitch,raw))
      : Math.max(-pitch*.15,Math.min(pitch*.15,raw*.2));

    const x=drag.axis==="x"?drag.offset:0;
    const y=drag.axis==="y"?drag.offset:0;

    tileAt(drag.index).style.transform=`translate(${x}px,${y}px)`;

    if (neighbour!==null) {
      const other=tileAt(neighbour);
      other.classList.add("drag-neighbour");
      other.style.transform=`translate(${-x}px,${-y}px)`;
    }
  },{passive:false});

  async function endDrag(event,cancelled=false) {
    if (!drag||drag.id!==event.pointerId) return;

    const current=drag;
    drag=null;
    ignoreClickUntil=performance.now()+600;

    try {
      if ($("board").hasPointerCapture(event.pointerId)) {
        $("board").releasePointerCapture(event.pointerId);
      }
    } catch {}

    $("board").classList.remove("is-dragging");

    if (!current.moved) {
      updateUI();

      if (!cancelled) {
        const cell=tileAt(current.index);
        const rect=cell.getBoundingClientRect();

        if (
          event.clientX>=rect.left && event.clientX<=rect.right &&
          event.clientY>=rect.top && event.clientY<=rect.bottom
        ) choose(current.index);
      }

      return;
    }

    if (
      !cancelled &&
      current.neighbour!==null &&
      Math.abs(current.offset)>=tilePitch()*.28
    ) {
      await attempt(current.index,current.neighbour);
      return;
    }

    busy=true;
    updateUI();

    await returnTiles([
      current.index,
      ...(current.neighbour===null?[]:[current.neighbour])
    ]);

    busy=false;
    updateUI();
  }

  $("board").addEventListener("pointerup",event=>endDrag(event));
  $("board").addEventListener("pointercancel",event=>endDrag(event,true));

  $("board").addEventListener("lostpointercapture",event=>{
    if (drag?.id===event.pointerId) endDrag(event,true);
  });

  window.addEventListener("blur",()=>{
    if (drag) endDrag({pointerId:drag.id},true);
  });

  // 真實滑鼠／手指操作由 pointerup 處理；
  // click 保留給鍵盤和輔助操作，避免鬆手後交換兩次。
  $("board").addEventListener("click",event=>{
    if (performance.now()<ignoreClickUntil||drag) return;
    const cell=event.target.closest("[data-cell]");
    if (cell) choose(Number(cell.dataset.cell));
  });

  $("board").addEventListener("keydown",event=>{
    const cell=event.target.closest("[data-cell]");
    if (!cell||busy||finished||drag) return;

    const shifts={
      ArrowLeft:-1,ArrowRight:1,
      ArrowUp:-SIZE,ArrowDown:SIZE
    };

    if (!(event.key in shifts)) return;

    event.preventDefault();

    const index=Number(cell.dataset.cell);
    const next=index+shifts[event.key];

    if (next>=0&&next<SIZE*SIZE&&adjacent(index,next)) {
      tileAt(next)?.focus();
    }
  });

  /* ---------- 按鈕與選關 ---------- */

  $("finishLevelButton").onclick=()=>{
    if (!busy&&!drag&&!finished&&goalsComplete()) finish(true);
  };

  $("hintButton").onclick=()=>{
    if (busy||drag||finished) return;

    const move=legalMove(grid);
    if (!move) return;

    selected=-1;
    renderBoard();
    move.forEach(index=>tileAt(index).classList.add("hinted"));
    say("金色邊框嗰兩隻兔兔，可以交換呀～");
  };

  $("shuffleButton").onclick=async()=>{
    if (busy||drag||finished||usedShuffle) return;

    busy=true;
    usedShuffle=true;
    updateUI();

    try {
      await reshuffle();
    } finally {
      busy=false;
      updateUI();
    }
  };

  $("restartButton").onclick=()=>{
    if (!busy&&!drag&&confirm("重新開始本關？")) {
      loadLevel(level.n);
    }
  };

  function levelMenu() {
    if (busy||drag) return;

    const dialog=$("dialog");
    if (dialog.open) dialog.close();

    dialog.innerHTML=`
      <h2>兔兔的五十關</h2>
      <p>完成關卡即可解鎖下一關，已過關的關卡可重玩衝三星。</p>
      <div class="levels">${LEVELS.map(item=>{
        const unlocked=item.n<=progress.unlocked;
        const stars=progress.stars[item.n]||0;

        return `<button type="button" data-level="${item.n}"
          ${unlocked?"":"disabled"}
          class="${item.n===level.n?"current":""}">
          ${unlocked?item.n:"鎖"}
          <small>${stars?"★".repeat(stars):"　"}</small>
        </button>`;
      }).join("")}</div>
      <div class="dialog-actions">
        <button data-close>關閉</button>
      </div>
    `;

    dialog.showModal();
  }

  $("levelsButton").onclick=levelMenu;

  $("dialog").addEventListener("click",event=>{
    const button=event.target.closest("button");
    if (!button) return;

    if (button.hasAttribute("data-level")) {
      const n=Number(button.dataset.level);

      if (n>=1&&n<=progress.unlocked) {
        $("dialog").close();
        loadLevel(n);
      }
    } else if (button.hasAttribute("data-next")) {
      $("dialog").close();
      loadLevel(Math.min(50,level.n+1));
    } else if (button.hasAttribute("data-retry")) {
      $("dialog").close();
      loadLevel(level.n);
    } else if (button.hasAttribute("data-level-menu")) {
      levelMenu();
    } else if (button.hasAttribute("data-close")) {
      $("dialog").close();
    }
  });

  loadLevel(progress.unlocked);
})();
</script>
</body>
</html>
