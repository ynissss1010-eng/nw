<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5f7">
<title>兔兔遊戲區 · Bunny accounting</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@600;800;900&display=swap");

:root {
  --bg:#fff7f5;
  --ink:#543e47;
  --muted:#86717a;
  --accent:#a45578;
  --line:#eddfe4;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.7 "Nunito","LXGW WenKai TC",
    "Microsoft JhengHei",sans-serif;
}
main{max-width:1000px;margin:auto;padding:25px 22px 45px}
header{display:flex;justify-content:space-between;align-items:center}
a{color:var(--accent);text-decoration:none}
.back{font-size:13px}
.brand{font-size:13px;font-weight:800}
.intro{margin:42px 0 30px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent)}
h1{font-size:38px;margin:9px 0}
.intro p{font-size:14px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.game{
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--line);border-radius:23px;
  background:#fffdfa;color:var(--ink);
  transition:transform .2s,border-color .2s;
}
.game:hover{transform:translateY(-4px);border-color:#c69aad}
.art{height:210px;display:grid;place-items:center}
.art svg{width:90%;max-width:250px;height:180px}
.run{background:#eaf0dd}
.match{background:#f7e3ec}
.merge{background:#f4e9d9}
.info{padding:22px;flex:1;display:flex;flex-direction:column}
h2{font-size:23px;margin:0 0 8px}
.info p{font-size:13px;color:var(--muted);margin:0 0 20px;flex:1}
.enter{font-size:13px;font-weight:800;color:var(--accent)}
.tag{font-size:10px;color:var(--muted);margin-bottom:8px}
footer{text-align:center;font-size:10px;color:var(--muted);margin-top:40px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
@media(max-width:700px){
  main{padding:20px 16px 35px}
  .intro{margin:30px 0 22px}
  h1{font-size:31px}
  .games{grid-template-columns:1fr;gap:16px}
  .game{display:grid;grid-template-columns:125px minmax(0,1fr)}
  .art{height:100%;min-height:170px}
  .art svg{width:120px;height:145px}
  .info{padding:20px 17px}
  h2{font-size:22px}
}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <a class="back" href="index.html">← 返回小窩</a>
  <span class="brand">Bunny accounting</span>
</header>

<section class="intro">
  <span class="eyebrow">A LITTLE PLAYTIME</span>
  <h1>兔兔遊戲區</h1>
  <p>記帳告一段落，陪兔兔玩一會兒。</p>
</section>

<section class="games">
  <a class="game" href="rabbit-run.html">
    <div class="art run">
      <svg viewBox="0 0 240 180" aria-hidden="true">
        <ellipse cx="122" cy="149" rx="89" ry="14" fill="#bfd49e"/>
        <path d="M92 84Q65 18 84 17q17 9 20 66
          M119 79q2-65 20-59 14 15-3 67"
          fill="#fff8ee" stroke="#8c7163" stroke-width="2"/>
        <ellipse cx="119" cy="119" rx="51" ry="29"
          fill="#fff8ee" stroke="#8c7163" stroke-width="2"/>
        <ellipse cx="101" cy="96" rx="36" ry="29"
          fill="#fff8ee" stroke="#8c7163" stroke-width="2"/>
        <path d="M84 94q5-8 10 0m17 0q5-8 10 0"
          fill="none" stroke="#795c53" stroke-width="2"/>
        <path d="M97 108q5 6 10 0" fill="none" stroke="#795c53" stroke-width="2"/>
        <ellipse cx="77" cy="143" rx="19" ry="7" fill="#fff8ee"/>
        <ellipse cx="147" cy="143" rx="19" ry="7" fill="#fff8ee"/>
        <path d="m181 145 5-22 19-8 16 15 2 15Z"
          fill="#aaa99b" stroke="#818675" stroke-width="2"/>
        <path d="M49 109H28m18 13H22" stroke="#a5b587"
          stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="info">
      <span class="tag">無盡跑酷 · 點擊跳躍</span>
      <h2>兔兔快跑</h2>
      <p>帶上你的兔兔，在草地上奔跑，跳過石頭挑戰最高分。</p>
      <span class="enter">開始奔跑 →</span>
    </div>
  </a>

  <a class="game" href="bunny-match.html">
    <div class="art match">
      <svg viewBox="0 0 240 180" aria-hidden="true">
        <defs>
          <g id="mini">
            <path d="M23 30Q8-3 20 3q10 6 10 26
              M38 28Q41-3 51 5q7 11-4 28"
              fill="currentColor" stroke="#987383" stroke-width="1.6"/>
            <ellipse cx="35" cy="45" rx="27" ry="22"
              fill="currentColor" stroke="#987383" stroke-width="1.6"/>
            <path d="M23 43h1m21 0h1m-14 9q3 4 6 0"
              fill="none" stroke="#79545d" stroke-width="2.5"
              stroke-linecap="round"/>
          </g>
        </defs>
        <g transform="translate(38 17)" color="#fff8ed"><use href="#mini"/></g>
        <g transform="translate(124 17)" color="#d8b995"><use href="#mini"/></g>
        <g transform="translate(38 96)" color="#b5a1b0"><use href="#mini"/></g>
        <g transform="translate(124 96)" color="#fff8ed"><use href="#mini"/></g>
      </svg>
    </div>
    <div class="info">
      <span class="tag">兔兔三消 · 50 關</span>
      <h2>消消兔</h2>
      <p>滑動交換可愛兔兔，完成收集任務，慢慢挑戰三星。</p>
      <span class="enter">開始消除 →</span>
    </div>
  </a>

  <a class="game" href="bunny-2048.html">
    <div class="art merge">
      <svg viewBox="0 0 240 180" aria-hidden="true">
        <rect x="38" y="20" width="74" height="66" rx="15" fill="#ead0ad"/>
        <rect x="125" y="20" width="74" height="66" rx="15" fill="#fff9ed"/>
        <rect x="38" y="98" width="74" height="66" rx="15" fill="#dbc8d5"/>
        <rect x="125" y="98" width="74" height="66" rx="15" fill="#ebbdcf"/>
        <g fill="#81576b" font-family="Nunito,sans-serif"
          font-size="34" font-weight="900" text-anchor="middle">
          <text x="75" y="66">2</text>
          <text x="162" y="66">4</text>
          <text x="75" y="144">8</text>
          <text x="162" y="144">16</text>
        </g>
      </svg>
    </div>
    <div class="info">
      <span class="tag">合併益智 · 滑動操作</span>
      <h2>兔兔 2048</h2>
      <p>相同數字的兔兔合在一起，看看能迎接哪一位新朋友。</p>
      <span class="enter">開始合併 →</span>
    </div>
  </a>
</section>

<footer>Made by Yanice Mai</footer>
</main>
</body>
</html>
