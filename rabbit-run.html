<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf4df">
<title>兔兔快跑 · Bunny accounting</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@600;800;900&display=swap");

:root {
  --ink:#435343;
  --accent:#91576e;
  --paper:#fffdf5;
}

* { box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
}

body {
  background:#edf4df;
  color:var(--ink);
  font:16px/1.6 "Nunito","LXGW WenKai TC",
    "Microsoft JhengHei",sans-serif;
}

.game {
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

canvas {
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.toolbar {
  position:absolute;
  top:max(14px, env(safe-area-inset-top));
  left:max(14px, env(safe-area-inset-left));
  right:max(14px, env(safe-area-inset-right));
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  pointer-events:none;
  z-index:2;
}

.toolbar-actions {
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.back, .pause {
  min-height:43px;
  padding:10px 13px;
  border:1px solid #cbd8bb;
  border-radius:13px;
  background:#fffdf5ed;
  color:var(--ink);
  text-decoration:none;
  font:700 12px/1.6 "Nunito","LXGW WenKai TC",sans-serif;
}

.pause { cursor:pointer; }

.score {
  min-width:100px;
  padding:10px 14px;
  border-radius:16px;
  background:#fffdf5e8;
  text-align:right;
  font-size:11px;
}

.score strong {
  display:block;
  font:900 30px/1.2 "Nunito",sans-serif;
}

.score small { color:#75846c; }

.overlay {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:22px;
  background:#edf4df55;
  z-index:3;
}

.overlay[hidden] { display:none; }

.sheet {
  width:min(380px,100%);
  max-height:calc(100dvh - 44px);
  overflow:auto;
  padding:26px 23px;
  border:1px solid #d6dfc8;
  border-radius:25px;
  background:#fffdf5f5;
  text-align:center;
  box-shadow:0 7px 0 #82936d12;
}

.preview {
  display:block;
  width:125px;
  height:115px;
  margin:0 auto 8px;
  object-fit:contain;
}

.preview[hidden] { display:none; }

h1 {
  margin:7px 0;
  font-size:33px;
  line-height:1.4;
}

.sheet p {
  margin:8px 0 20px;
  color:#74806b;
  font-size:14px;
}

.actions {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.start, .exit {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:11px 18px;
  border:1px solid #d3d9c8;
  border-radius:14px;
  font:700 14px "Nunito","LXGW WenKai TC",sans-serif;
  text-decoration:none;
  cursor:pointer;
}

.start {
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.start:disabled {
  opacity:.5;
  cursor:wait;
}

.exit {
  background:white;
  color:var(--ink);
}

button:focus-visible, a:focus-visible {
  outline:3px solid var(--accent);
  outline-offset:4px;
}

.hint {
  position:absolute;
  left:12px;
  right:12px;
  bottom:max(17px, env(safe-area-inset-bottom));
  text-align:center;
  font-size:12px;
  color:#536c49;
  pointer-events:none;
}

.credit {
  margin-top:17px;
  color:#74806b;
  font-size:10px;
}

@media(max-width:600px) {
  .toolbar {
    gap:8px;
  }

  .toolbar-actions {
    gap:6px;
  }

  .back, .pause {
    padding:9px 10px;
    font-size:11px;
  }

  .score {
    min-width:86px;
    padding:9px 11px;
  }

  .score strong {
    font-size:27px;
  }

  .hint {
    font-size:11px;
  }
}

@media(max-height:480px) {
  .sheet {
    padding:16px 22px;
  }

  .preview {
    width:80px;
    height:70px;
    margin-bottom:0;
  }

  h1 {
    font-size:26px;
    margin:3px 0;
  }

  .sheet p {
    margin:5px 0 13px;
    font-size:12px;
  }

  .credit {
    margin-top:10px;
  }
}
</style>
</head>

<body>
<main class="game">

  <canvas id="game"
    aria-label="兔兔快跑，點擊畫面或按空白鍵跳過石頭">
  </canvas>

  <header class="toolbar">
    <div class="toolbar-actions">
      <a class="back" href="index.html">← 返回小窩</a>
      <button class="pause" id="pause" type="button">暫停</button>
    </div>

    <div class="score">
      分數
      <strong id="score">0</strong>
      <small>最高 <span id="best">0</span></small>
    </div>
  </header>

  <section class="overlay" id="overlay">
    <div class="sheet">
      <img id="preview" class="preview" alt="你領養的兔兔" hidden>

      <h1 id="title">兔兔快跑</h1>

      <p id="message">兔兔正在準備出發……</p>

      <div class="actions">
        <button class="start" id="start" type="button" disabled>
          正在載入兔兔
        </button>
        <a class="exit" href="index.html">返回小窩</a>
      </div>

      <div class="credit">Made by Yanice Mai</div>
    </div>
  </section>

  <div class="hint" id="hint">
    點一下畫面跳躍 · 電腦可按 Space / ↑
  </div>

</main>

<script>
"use strict";

(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("game");
  const ctx = canvas.getContext("2d");

  const overlay = $("overlay");
  const title = $("title");
  const message = $("message");
  const startButton = $("start");
  const pauseButton = $("pause");
  const scoreLabel = $("score");
  const bestLabel = $("best");
  const preview = $("preview");

  // 約 0.85 秒完成一次跳躍，最高約 181。
// 配合手機起步速度，每跳跨越約 187 個世界座標單位。
const GRAVITY = 2000;
const JUMP_SPEED = -850;

  const STEP = 1 / 120;
  const BEST_KEY = "bunny-run-best-v1";

  let worldWidth = 900;
  let worldHeight = 500;
  let ground = 380;
  let displayScale = 1;
  let dpr = 1;

  let mode = "ready";
  let ready = false;
  let best = 0;
  let score = 0;
  let elapsedRun = 0;
  let distance = 0;
  let speed = 300;
  let spawnTimer = 1.7;
  let rocks = [];

  let clock = 0;
  let lastTime = 0;
  let accumulator = 0;
  let jumpBuffer = 0;
  let lastScoreDisplay = -1;

  const images = {};

  const bunny = {
    x:155,
    y:380,
    vy:0,
    onGround:true
  };

  try {
    const value = Number(localStorage.getItem(BEST_KEY));
    if (Number.isFinite(value) && value >= 0) {
      best = Math.floor(value);
    }
  } catch {}

  bestLabel.textContent = best;

  /* ---------- 響應式畫面 ---------- */

  function resize() {
    const width = Math.max(1, canvas.clientWidth);
    const height = Math.max(1, canvas.clientHeight);

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    /*
     * 手機不再把 900px 橫向畫面整張縮小。
     * 以螢幕高度決定兔兔大小，世界寬度跟著螢幕調整。
     */
    displayScale = Math.max(.68, Math.min(1.5, height / 560));

    worldWidth = width / displayScale;
    worldHeight = height / displayScale;
    ground = worldHeight * .77;

    bunny.x = Math.min(155, Math.max(65, worldWidth * .24));

    // 改變尺寸時不保留舊障礙，避免石頭突然出現在身邊。
    rocks = [];
    spawnTimer = 1.7;
    bunny.y = ground;
    bunny.vy = 0;
    bunny.onGround = true;
    jumpBuffer = 0;

    if (mode === "running") {
      pauseGame("畫面尺寸改變了，準備好再繼續呀～");
    }
  }

  window.addEventListener("resize", resize);
  resize();

  /* ---------- 沿用首頁兔兔 ---------- */

  const expressions = {
    normal: `
      <g fill="none" stroke="#6d5048" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="83" cy="114" rx="3.8" ry="5"
          fill="#44302b" stroke="none"/>
        <ellipse cx="120" cy="114" rx="3.8" ry="5"
          fill="#44302b" stroke="none"/>
        <circle cx="84" cy="112" r="1.3"
          fill="white" stroke="none"/>
        <circle cx="121" cy="112" r="1.3"
          fill="white" stroke="none"/>
        <path d="M97 137q5 5 10 0"/>
      </g>`,

    happy: `
      <g fill="none" stroke="#6d5048" stroke-width="2.3"
        stroke-linecap="round">
        <path d="M77 116q6-10 12 0m25 0q6-10 12 0"/>
        <path d="M95 135q7 13 14 0Z" fill="#bd7c8e"/>
      </g>
      <ellipse cx="74" cy="128" rx="10" ry="5"
        fill="#e894ab" opacity=".6"/>
      <ellipse cx="130" cy="128" rx="10" ry="5"
        fill="#e894ab" opacity=".6"/>`,

    blink: `
      <g fill="none" stroke="#6d5048" stroke-width="2"
        stroke-linecap="round">
        <path d="M77 115q6 5 12 0m25 0q6 5 12 0"/>
        <path d="M97 137q5 5 10 0"/>
      </g>`,

    jump: `
      <g fill="none" stroke="#6d5048" stroke-width="2"
        stroke-linecap="round">
        <ellipse cx="83" cy="114" rx="4.5" ry="6"
          fill="#44302b" stroke="none"/>
        <ellipse cx="120" cy="114" rx="4.5" ry="6"
          fill="#44302b" stroke="none"/>
        <circle cx="84" cy="112" r="1.4"
          fill="white" stroke="none"/>
        <circle cx="121" cy="112" r="1.4"
          fill="white" stroke="none"/>
        <ellipse cx="102" cy="139" rx="3" ry="4"
          fill="#b77c87" stroke="none"/>
      </g>`,

    crash: `
      <g fill="none" stroke="#6d5048" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m78 109 9 6-9 5m47-11-9 6 9 5"/>
        <path d="M97 141q5-6 10 0"/>
      </g>
      <path d="M140 118q7 10 0 14q-7-4 0-14Z"
        fill="#a8cede"/>`
  };

  async function loadBunny() {
    let source;

    try {
      source = sessionStorage.getItem("bunny-run-home-appearance");
    } catch {}

    if (!source) {
      message.textContent =
        "請返回首頁，從「兔兔快跑」入口進來，把你領養的兔兔帶過來。";
      startButton.textContent = "請先返回首頁";
      return;
    }

    try {
      const template = new DOMParser().parseFromString(
        source, "image/svg+xml"
      );

      if (
        template.querySelector("parsererror") ||
        template.documentElement.localName !== "svg"
      ) {
        throw Error("Invalid rabbit SVG");
      }

      await Promise.all(
        Object.entries(expressions).map(async ([name, expression]) => {
          const copy = template.cloneNode(true);
          const svg = copy.documentElement;

          let face = copy.querySelector("[data-run-face]");

          if (!face) {
            face = copy.createElementNS(
              "http://www.w3.org/2000/svg", "g"
            );
            face.setAttribute("data-run-face", "");
            svg.append(face);
          }

          face.innerHTML = expression;

          const text = new XMLSerializer().serializeToString(copy);
          const url = URL.createObjectURL(
            new Blob([text], {type:"image/svg+xml;charset=utf-8"})
          );

          try {
            images[name] = await new Promise((resolve, reject) => {
              const image = new Image();
              image.onload = () => resolve(image);
              image.onerror = () => reject(Error("Image load failed"));
              image.src = url;
            });
          } finally {
            URL.revokeObjectURL(url);
          }
        })
      );

      // 預覽使用已解碼圖像轉成 PNG，不依賴已釋放的 Blob URL。
      const small = document.createElement("canvas");
      small.width = 240;
      small.height = 220;
      small.getContext("2d").drawImage(images.happy, 0, 0, 240, 220);

      preview.src = small.toDataURL("image/png");
      preview.hidden = false;

      ready = true;
      startButton.disabled = false;
      startButton.textContent = "開始奔跑";
      message.textContent =
        "點一下跳過石頭，越跑越快。準備好就出發啦～";
    } catch (error) {
      console.error("載入兔兔：", error);
      message.textContent =
        "兔兔圖片未能載入。請返回首頁，再從遊戲入口進來。";
      startButton.textContent = "載入失敗";
    }
  }

  /* ---------- 遊戲狀態 ---------- */

  function baseSpeed() {
  // 手機也保持足夠跑速，不再降到慢慢挪動。
  return worldWidth < 600 ? 220 : 300;
}


  function startGame() {
    if (!ready) return;

    mode = "running";
    score = 0;
    elapsedRun = 0;
    distance = 0;
    speed = baseSpeed();
    spawnTimer = 1.7;
    rocks = [];
    jumpBuffer = 0;
    accumulator = 0;
    lastScoreDisplay = -1;

    bunny.y = ground;
    bunny.vy = 0;
    bunny.onGround = true;

    overlay.hidden = true;
    pauseButton.textContent = "暫停";
    scoreLabel.textContent = "0";
    lastTime = performance.now();

    // 避免開始按鈕保留焦點，擋住空白鍵跳躍。
    startButton.blur();
  }

  function resumeGame() {
    mode = "running";
    overlay.hidden = true;
    accumulator = 0;
    lastTime = performance.now();
    pauseButton.textContent = "暫停";
    startButton.blur();
  }

  function pauseGame(reason = "兔兔等緊你，準備好再繼續～") {
    if (mode !== "running") return;

    mode = "paused";
    jumpBuffer = 0;
    accumulator = 0;

    title.textContent = "休息一下";
    message.textContent = reason;
    startButton.textContent = "繼續奔跑";
    overlay.hidden = false;
    pauseButton.textContent = "已暫停";
  }

  function endGame() {
    mode = "over";
    jumpBuffer = 0;

    if (score > best) {
      best = score;
      bestLabel.textContent = best;
      try {
        localStorage.setItem(BEST_KEY, String(best));
      } catch {}
    }

    title.textContent = "哎呀，撞到石頭喇！";
    message.textContent = `今次 ${score} 分，拍拍毛毛再跑一次？`;
    startButton.textContent = "再跑一次";
    overlay.hidden = false;
    pauseButton.textContent = "暫停";
  }

  function requestJump() {
    if (mode !== "running") return;
    // 落地前一小段時間按跳，也會在落地後接上。
    jumpBuffer = .11;
  }

  startButton.addEventListener("click", () => {
    if (mode === "paused") resumeGame();
    else startGame();
  });

  pauseButton.addEventListener("click", () => {
    if (mode === "running") pauseGame();
  });

  canvas.addEventListener("pointerdown", event => {
    if (!event.isPrimary || event.button !== 0) return;
    event.preventDefault();
    requestJump();
  });

  document.addEventListener("keydown", event => {
    if (event.code === "Escape" && mode === "running") {
      event.preventDefault();
      pauseGame();
      return;
    }

    if (!["Space", "ArrowUp"].includes(event.code)) return;
    if (mode !== "running") return;

    event.preventDefault();
    if (!event.repeat) requestJump();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pauseGame("兔兔幫你暫停喇，返嚟再繼續～");
  });

  window.addEventListener("blur", () => {
    pauseGame("準備好再繼續，唔使急～");
  });

  /* ---------- 障礙與物理 ---------- */

  function spawnRock() {
  const spawnX = worldWidth + 30;
  const previous = rocks[rocks.length - 1];

  /*
   * 用最高跑速預留間距：
   * 一次跳躍約 0.85 秒，
   * 兩塊石頭中間至少保留 1.65 秒跑動距離。
   */
  const maximumSpeed = baseSpeed() * 1.30;
  const minimumGap = maximumSpeed * 1.65;

  if (
    previous &&
    spawnX - (previous.x + previous.w) < minimumGap
  ) {
    spawnTimer = 0.08;
    return;
  }

  const tall = Math.random() < 0.35;

  rocks.push({
    x: spawnX,

    // 不把難度同時堆在速度和巨型石頭上。
    w: tall
      ? 27 + Math.random() * 6
      : 34 + Math.random() * 8,

    h: tall
      ? 34 + Math.random() * 7
      : 25 + Math.random() * 8
  });

  // 每次生成後留出穩定準備時間，不隨分數強行縮短。
  spawnTimer = 1.95 + Math.random() * 0.40;
}


  function update(dt) {
    clock += dt;

    if (mode !== "running") return;

    elapsedRun += dt;
    score = Math.floor(elapsedRun * 10);

    // 持續奔跑 90 秒，逐漸達到最高速度。
// 手機：220 → 286；電腦：300 → 390。
const difficulty = Math.min(1, elapsedRun / 90);
speed = baseSpeed() * (1 + difficulty * 0.30);

    distance += speed * dt;

    if (jumpBuffer > 0 && bunny.onGround) {
      bunny.vy = JUMP_SPEED;
      bunny.onGround = false;
      jumpBuffer = 0;
    } else {
      jumpBuffer = Math.max(0, jumpBuffer - dt);
    }

    bunny.vy += GRAVITY * dt;
    bunny.y += bunny.vy * dt;

    if (bunny.y >= ground) {
      bunny.y = ground;
      bunny.vy = 0;
      bunny.onGround = true;
    }

    // 每個步進只扣一次，不再重複生成障礙。
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnRock();

    rocks.forEach(rock => {
      rock.x -= speed * dt;
    });

    rocks = rocks.filter(rock => rock.x + rock.w > -60);

    /*
     * 寬鬆碰撞框：
     * 不把耳朵、尾巴、鬚鬚及外圍絨毛當成身體。
     */
    const player = {
      left:bunny.x - 21,
      right:bunny.x + 24,
      top:bunny.y - 48,
      bottom:bunny.y - 4
    };

    for (const rock of rocks) {
      const obstacle = {
        left:rock.x + 5,
        right:rock.x + rock.w - 5,
        top:ground - rock.h + 6
      };

      if (
        player.right > obstacle.left &&
        player.left < obstacle.right &&
        player.bottom > obstacle.top &&
        player.top < ground
      ) {
        endGame();
        break;
      }
    }
  }

  /* ---------- 草地背景 ---------- */

  function oval(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function stroke(points, color, width = 2) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.slice(1).forEach(([x,y]) => ctx.lineTo(x,y));
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
  }

  function cloud(x, y, scale) {
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    oval(0,0,34,13,"#fffdf3");
    oval(-18,-5,18,14,"#fffdf3");
    oval(7,-13,23,19,"#fffdf3");
    oval(29,-2,18,13,"#fffdf3");
    ctx.restore();
  }

  function background() {
    ctx.fillStyle = "#edf4df";
    ctx.fillRect(0,0,worldWidth,worldHeight);

    oval(worldWidth * .78, ground * .23, 29,29,"#f7e6aa");

    const cloudSpan = worldWidth + 180;
    const cloudCount = Math.max(3, Math.ceil(worldWidth / 240));

    for (let i = 0; i < cloudCount; i++) {
      const x = (
        (i * 255 + 80 - distance * .07) % cloudSpan + cloudSpan
      ) % cloudSpan - 70;

      cloud(x, ground * .25 + (i % 2) * 36, .7);
    }

    // 山丘也按實際螢幕寬度繪製，不使用固定的橫向座標。
    ctx.beginPath();
    ctx.moveTo(0,ground);
    ctx.quadraticCurveTo(
      worldWidth * .2, ground - 105,
      worldWidth * .48, ground - 35
    );
    ctx.quadraticCurveTo(
      worldWidth * .75, ground - 105,
      worldWidth, ground - 30
    );
    ctx.lineTo(worldWidth,worldHeight);
    ctx.lineTo(0,worldHeight);
    ctx.closePath();
    ctx.fillStyle = "#dce8c4";
    ctx.fill();

    ctx.fillStyle = "#b9d394";
    ctx.fillRect(0,ground,worldWidth,worldHeight-ground);
    stroke([[0,ground],[worldWidth,ground]],"#8eb072",2.5);

    const spacing = 36;
    const shift = (distance * .8) % spacing;

    for (let i = -1; i < worldWidth / spacing + 2; i++) {
      const x = i * spacing - shift;
      const y = ground + 19 + ((i % 3 + 3) % 3) * 19;

      stroke([[x-3,y],[x,y-6],[x+2,y]],"#8eae73",1.2);

      if ((i + 99) % 5 === 0) {
        oval(x+13,y-4,3,3,"#fff8dc");
        oval(x+13,y-4,1,1,"#d4b85c");
      }
    }
  }

  function drawRock(rock) {
    const {x,w,h} = rock;

    oval(x+w/2,ground+3,w*.58,3.5,"#8a9e7240");

    ctx.beginPath();
    ctx.moveTo(x,ground);
    ctx.lineTo(x+w*.1,ground-h*.6);
    ctx.lineTo(x+w*.37,ground-h);
    ctx.lineTo(x+w*.75,ground-h*.85);
    ctx.lineTo(x+w,ground-h*.3);
    ctx.lineTo(x+w*.95,ground);
    ctx.closePath();

    ctx.fillStyle = "#a2a49a";
    ctx.fill();
    ctx.strokeStyle = "#7c8277";
    ctx.lineWidth = 1.7;
    ctx.stroke();

    stroke([
      [x+w*.17,ground-h*.55],
      [x+w*.4,ground-h*.8],
      [x+w*.62,ground-h*.66]
    ],"#c8c9bd",1.6);
  }

  /* ---------- 首頁兔兔跑步 ---------- */

  function drawBunny() {
    if (!ready) return;

    const moving = mode === "running";
    const airborne = !bunny.onGround;
    const phase = clock * 15;
    const hop = moving && !airborne
      ? Math.abs(Math.sin(phase)) * 4
      : 0;

    const height = Math.max(0,ground-bunny.y);

    oval(
      bunny.x,
      ground+4,
      Math.max(16,32-height*.065),
      4.5,
      "#6e8a5d28"
    );

    let face = "normal";
    if (mode === "over") face = "crash";
    else if (airborne) face = "jump";
    else if (clock % 4 > 3.86) face = "blink";
    else if (moving && clock % 3 < .6) face = "happy";

    ctx.save();
    ctx.translate(bunny.x,bunny.y-hop);

    // 沿用首頁原圖，向右跑時水平翻轉。
    ctx.scale(-1,1);

    const tilt = airborne
      ? bunny.vy < 0 ? .075 : -.025
      : moving ? Math.sin(phase)*.025 : 0;

    ctx.rotate(tilt);

    const scale = .49;
    ctx.drawImage(
      images[face],
      -120*scale,
      -198*scale,
      240*scale,
      220*scale
    );
    ctx.restore();

    if (moving && !airborne) {
      for (let i=0;i<3;i++) {
        const p = (clock*2.8+i/3)%1;

        oval(
          bunny.x-35-p*22,
          ground-3-p*7,
          2.5*(1-p)+.3,
          1.5*(1-p)+.2,
          `rgba(165,151,119,${.3*(1-p)})`
        );
      }
    }
  }

  function draw() {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const scale = displayScale*dpr;
    ctx.setTransform(scale,0,0,scale,0,0);

    background();
    rocks.forEach(drawRock);
    drawBunny();

    if (score !== lastScoreDisplay) {
      scoreLabel.textContent = score;
      lastScoreDisplay = score;
    }
  }

  function frame(time) {
    if (!lastTime) lastTime = time;

    const dt = Math.min((time-lastTime)/1000,.05);
    lastTime = time;

    if (!document.hidden) {
      accumulator += dt;

      while (accumulator >= STEP) {
        update(STEP);
        accumulator -= STEP;
      }

      draw();
    }

    requestAnimationFrame(frame);
  }

  loadBunny();
  requestAnimationFrame(frame);
})();
</script>
</body>
