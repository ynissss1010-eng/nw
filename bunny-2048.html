<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f2">
<title>兔兔 2048 · Bunny accounting</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@600;800;900&display=swap");

:root{
  --bg:#fff7f2;
  --paper:#fffdfa;
  --ink:#563f48;
  --muted:#87717b;
  --accent:#a45377;
  --line:#eadce2;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 "Nunito","LXGW WenKai TC",
    "Microsoft JhengHei",sans-serif;
}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{
  font:inherit;cursor:pointer;min-height:43px;
  padding:9px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);color:inherit;
}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
button:focus-visible,a:focus-visible,.board:focus-visible{
  outline:3px solid var(--accent);outline-offset:4px;
}
.wrap{width:min(530px,100%);margin:auto;padding:20px 15px 35px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header a{font-size:12px}
h1{font-size:32px;margin:0}
.subtitle{text-align:center;font-size:12px;color:var(--muted);margin:9px 0 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.scores{display:flex;gap:9px}
.score{
  min-width:92px;text-align:center;background:var(--paper);
  border:1px solid var(--line);border-radius:13px;padding:8px 13px;
}
.score span{display:block;font-size:10px;color:var(--muted)}
.score strong{display:block;font-size:23px;line-height:1.3}
.board{
  --gap:9px;
  --pad:10px;
  position:relative;
  width:100%;
  aspect-ratio:1;
  padding:var(--pad);
  background:#dfccd4;
  border-radius:21px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
}
.cells{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:var(--gap);
  height:100%;
}
.cell{background:#f6eaf0a1;border-radius:14px}
.tile{
  position:absolute;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:var(--tile-bg);
  box-shadow:0 2px 0 #a77c8e18;
  pointer-events:none;
}
.tile svg{width:82%;height:73%;display:block;overflow:visible}
.tile strong{
  display:block;
  font:900 clamp(23px,6.5vw,33px)/1 "Nunito",sans-serif;
  color:#654653;
  margin-top:-5%;
  padding-bottom:7%;
}
.tile[data-large="true"] strong{
  font-size:clamp(19px,5.4vw,27px);
}
.message{
  min-height:42px;
  text-align:center;font-size:13px;
  color:var(--accent);padding:13px 3px 0;
}
.help{text-align:center;color:var(--muted);font-size:12px}
.collection{margin-top:24px;border-top:1px dashed var(--line);padding-top:18px}
.collection h2{font-size:16px;margin:0 0 12px}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.legend-item{
  background:var(--paper);border:1px solid var(--line);
  border-radius:12px;text-align:center;padding:8px 3px;
}
.legend-item svg{width:53px;height:55px;display:block;margin:auto}
.legend-item strong{font-size:13px}
.legend-item small{display:block;font-size:9px;color:var(--muted)}
footer{text-align:center;font-size:10px;color:var(--muted);margin-top:26px}
dialog{
  width:min(380px,calc(100% - 24px));max-height:85dvh;overflow:auto;
  border:1px solid var(--line);border-radius:22px;
  background:var(--paper);color:var(--ink);
  padding:28px 23px;text-align:center;
}
dialog::backdrop{background:#4b344766}
dialog h2{font-size:27px;margin:0 0 10px}
dialog p{font-size:13px;color:var(--muted)}
.dialog-actions{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:20px}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
@media(max-width:380px){
  .wrap{padding:14px 10px 28px}
  h1{font-size:27px}
  .board{--gap:6px;--pad:8px;border-radius:17px}
  .tile,.cell{border-radius:11px}
  .score{min-width:80px;padding:7px 9px}
}
/* 2048：改用兔兔頭像，數字放在下面 */
.tile svg {
  width: 88%;
  height: 73%;
  flex-shrink: 0;
}

.tile strong {
  margin-top: 0;
  padding-bottom: 5%;
}

/* 下方圖鑑同步使用頭像 */
.legend-item svg {
  width: 58px;
  height: 62px;
}

</style>
</head>
<body>
<main class="wrap">
  <header>
    <a href="games.html">← 遊戲區</a>
    <h1>兔兔 2048</h1>
    <a href="index.html">小窩</a>
  </header>

  <p class="subtitle">兩隻一樣的小兔兔，合成一位新朋友。</p>

  <div class="top">
    <div class="scores">
      <div class="score"><span>分數</span><strong id="score">0</strong></div>
      <div class="score"><span>最高分</span><strong id="best">0</strong></div>
    </div>
    <button type="button" id="newGame">新遊戲</button>
  </div>

  <div class="board" id="board"
    tabindex="0" role="group"
    aria-label="兔兔2048棋盤，使用方向鍵或滑動移動">
    <div class="cells" aria-hidden="true"></div>
  </div>

  <div class="message" id="message" role="status" aria-live="polite"></div>
  <p class="help">
    滑動或按方向鍵移動。相同數字相遇時合併。<br>
    每次有效移動後新增一隻兔兔，合成 2048 就成功！
  </p>

  <section class="collection">
    <h2>兔兔合成圖鑑</h2>
    <div class="legend" id="legend"></div>
  </section>

  <footer>Made by Yanice Mai</footer>
</main>

<dialog id="dialog"></dialog>

<script>
"use strict";

(() => {
  const $ = id => document.getElementById(id);
  const SIZE = 4;
  const KEY = "bunny-2048-save-v1";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  const RABBITS = [
    {name:"奶茶侏儒兔",fur:"#ddc09c",bg:"#f5e8d3",breed:0},
    {name:"白色侏儒兔",fur:"#fffaf0",bg:"#fff5e6",breed:0},
    {name:"灰色垂耳兔",fur:"#aab3bd",bg:"#e7eff3",breed:1},
    {name:"可可長毛兔",fur:"#b69b8e",bg:"#f1e1d8",breed:2},
    {name:"黑白道奇兔",fur:"#77717b",bg:"#eae6f1",breed:3},
    {name:"奶茶垂耳兔",fur:"#d8bb94",bg:"#f5dfc5",breed:1},
    {name:"白色長毛兔",fur:"#fff9ef",bg:"#f8dfeb",breed:2,bow:true},
    {name:"灰色侏儒兔",fur:"#a7a4b8",bg:"#e8dff3",breed:0,bow:true},
    {name:"可可垂耳兔",fur:"#ab8d7f",bg:"#ead4cd",breed:1,bow:true},
    {name:"奶油道奇兔",fur:"#d2b795",bg:"#f1dfb8",breed:3,bow:true},
    {name:"星星兔兔",fur:"#fff7e8",bg:"#f5dca6",breed:0,crown:true}
  ];

  let board = Array(16).fill(0);
  let score = 0;
  let best = 0;
  let won = false;
  let busy = false;
  let pointer = null;

  function rabbitFor(value) {
    const index = Math.max(0,Math.log2(value)-1);
    return RABBITS[Math.min(index,RABBITS.length-1)];
  }

  function rabbitSVG(value) {
    const t = rabbitFor(value);
    const lop = t.breed === 1 || t.breed === 2;
    const fluffy = t.breed === 2;
    const dutch = t.breed === 3;

    return `<svg viewBox="32 0 140 155" aria-hidden="true">


      ${!lop?`
        <path d="M79 91Q57 13 75 9Q93 10 98 87
          M112 87Q114 10 133 14Q148 19 129 94"
          fill="${t.fur}" stroke="#80655e" stroke-width="2"/>
        <path d="M80 69Q70 25 77 27l9 43
          M121 71q5-44 12-42l-7 43" fill="#e9b7c8"/>
      `:""}

      ${fluffy?`
        <path d="m63 98-9 13 8 8-8 12 12 5-4 13 15 1
          2 12 14-5 10 10 12-8 14 6 8-12 15 2 1-14
          10-6-7-11 7-12-11-8 2-12-15 1-4-11-13 5
          -10-8-11 9-12-5-6 10Z"
          fill="${t.fur}" stroke="#80655e" stroke-width="1.6"/>
      `:""}

      <ellipse cx="103" cy="113" rx="44" ry="37"
        fill="${t.fur}" stroke="#80655e" stroke-width="2"/>

      ${dutch?`
        <path d="m103 77-13 34q-8 20-1 34 15 9 29-1
          6-14-3-33Z" fill="#fffaf2"/>
      `:""}

      ${lop?`
        <path d="M66 85Q40 85 43 119l5 28q4 16 15 4l14-45
          M137 85q23 4 19 36l-7 28q-5 13-14 0l-10-43"
          fill="${t.fur}" stroke="#80655e" stroke-width="2"/>
        <path d="M55 103q-5 19 1 34m86-33q5 18-1 34"
          stroke="#e2b1c0" stroke-width="6" fill="none"
          stroke-linecap="round"/>
      `:""}

      ${fluffy?`
        <path d="m73 90 7-11 7 5 9-9 7 7 11-6 6 10"
          fill="${t.fur}" stroke="#80655e" stroke-width="1.5"/>
      `:""}

      <ellipse cx="84" cy="110" rx="4.5" ry="6" fill="#49362f"/>
      <ellipse cx="122" cy="110" rx="4.5" ry="6" fill="#49362f"/>
      <circle cx="85.5" cy="108" r="1.6" fill="white"/>
      <circle cx="123.5" cy="108" r="1.6" fill="white"/>
      <ellipse cx="75" cy="124" rx="9" ry="4.5" fill="#e9a2b8" opacity=".65"/>
      <ellipse cx="131" cy="124" rx="9" ry="4.5" fill="#e9a2b8" opacity=".65"/>
      <path d="M99 122q4-3 8 0l-4 4Z" fill="#b77d8c"/>
      <path d="M103 126v4m0 0q-5 5-9 0m9 0q5 5 9 0"
        fill="none" stroke="#80655e" stroke-width="1.5"
        stroke-linecap="round"/>

      ${t.bow ? `
  <g transform="translate(133 87) rotate(15)">
    <path d="M0 0Q-16-13-16-3V9Q-15 16 0 4
      Q16 16 16 8V-3Q16-13 0 0Z"
      fill="#d58caa"
      stroke="#a86c89"
      stroke-width="1.3"/>
    <circle cx="0" cy="2" r="4" fill="#f5c6d6"
      stroke="#a86c89" stroke-width="1"/>
  </g>
` : ""}


      ${t.crown?`
        <path d="m84 78-4-20 13 8 10-16 10 16 13-8-4 20Z"
          fill="#e5b85c" stroke="#b6883d" stroke-width="1.5"/>
      `:""}
    </svg>`;
  }

  function say(text) {
    $("message").textContent = text;
  }

  function save() {
    try {
      localStorage.setItem(KEY,JSON.stringify({
        version:1,board,score,best,won
      }));
    } catch {
      say("今次進度未能保存，但仍可繼續遊玩。");
    }
  }

  function validSave(data) {
    return data?.version === 1 &&
      Array.isArray(data.board) && data.board.length === 16 &&
      data.board.every(v=>v===0||(
        Number.isSafeInteger(v)&&v>=2&&Number.isInteger(Math.log2(v))
      )) &&
      Number.isSafeInteger(data.score)&&data.score>=0 &&
      Number.isSafeInteger(data.best)&&data.best>=0 &&
      typeof data.won === "boolean";
  }

  function geometry() {
    const root = $("board");
    const css = getComputedStyle(root);
    const pad = parseFloat(css.getPropertyValue("--pad"));
    const gap = parseFloat(css.getPropertyValue("--gap"));
    const size = (root.clientWidth-pad*2-gap*3)/4;
    return {pad,gap,size};
  }

  function location(index) {
    const {pad,gap,size}=geometry();
    return {
      x:pad+(index%4)*(size+gap),
      y:pad+Math.floor(index/4)*(size+gap),
      size
    };
  }

  function tile(value,index) {
    const el=document.createElement("div");
    const pos=location(index);
    const type=rabbitFor(value);

    el.className="tile";
    el.dataset.large=String(value>=1024);
    el.style.setProperty("--tile-bg",type.bg);
    el.style.width=pos.size+"px";
    el.style.height=pos.size+"px";
    el.style.left=pos.x+"px";
    el.style.top=pos.y+"px";
    el.setAttribute("aria-label",`${value}，${type.name}`);
    el.innerHTML=rabbitSVG(value)+`<strong>${value}</strong>`;

    $("board").append(el);
    return el;
  }

  function clearTiles() {
    $("board").querySelectorAll(".tile").forEach(el=>el.remove());
  }

  function render(spawnIndex=-1,merged=[]) {
    clearTiles();

    board.forEach((value,index)=>{
      if(!value)return;
      const el=tile(value,index);

      if(!reduced.matches&&(index===spawnIndex||merged.includes(index))) {
        el.animate(
          merged.includes(index)
            ? [
                {transform:"scale(.88)"},
                {transform:"scale(1.1)",offset:.55},
                {transform:"scale(1)"}
              ]
            : [
                {transform:"scale(.35)",opacity:0},
                {transform:"scale(1)",opacity:1}
              ],
          {duration:190,easing:"ease-out"}
        );
      }
    });

    $("score").textContent=score;
    $("best").textContent=best;
    $("newGame").disabled=busy;
    $("board").setAttribute("aria-busy",String(busy));
  }

  function addTile() {
    const empty=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
    if(!empty.length)return -1;
    const index=empty[Math.floor(Math.random()*empty.length)];
    board[index]=Math.random()<.9?2:4;
    return index;
  }

  function lineIndices(direction,line) {
    if(direction==="left")return [0,1,2,3].map(c=>line*4+c);
    if(direction==="right")return [3,2,1,0].map(c=>line*4+c);
    if(direction==="up")return [0,1,2,3].map(r=>r*4+line);
    return [3,2,1,0].map(r=>r*4+line);
  }

  /*
   * 一次移動中，每個新合成的格子只合併一次。
   * 例如 2,2,4,0 向左會得到 4,4,0,0，不會直接變 8。
   */
  function calculate(direction) {
    const next=Array(16).fill(0);
    const movements=[];
    const merged=[];
    let gain=0;

    for(let line=0;line<4;line++) {
      const indices=lineIndices(direction,line);
      const items=indices.filter(i=>board[i]!==0)
        .map(i=>({value:board[i],from:i}));

      let output=0;

      for(let i=0;i<items.length;i++) {
        const first=items[i];
        const destination=indices[output++];

        if(i+1<items.length&&items[i+1].value===first.value) {
          const second=items[++i];
          next[destination]=first.value*2;
          gain+=next[destination];
          merged.push(destination);
          movements.push(
            {...first,to:destination},
            {...second,to:destination}
          );
        } else {
          next[destination]=first.value;
          movements.push({...first,to:destination});
        }
      }
    }

    return {
      next,movements,merged,gain,
      changed:next.some((value,index)=>value!==board[index])
    };
  }

  function hasMoves() {
    if(board.includes(0))return true;

    for(let r=0;r<4;r++) {
      for(let c=0;c<4;c++) {
        const i=r*4+c;
        if(c<3&&board[i]===board[i+1])return true;
        if(r<3&&board[i]===board[i+4])return true;
      }
    }
    return false;
  }

  async function animateMove(movements) {
    clearTiles();

    const tasks=movements.map(item=>{
      const el=tile(item.value,item.from);
      const from=location(item.from);
      const to=location(item.to);

      if(reduced.matches)return Promise.resolve();

      const animation=el.animate(
        [
          {transform:"translate(0,0)"},
          {transform:`translate(${to.x-from.x}px,${to.y-from.y}px)`}
        ],
        {
          duration:150,
          easing:"cubic-bezier(.2,.75,.25,1)",
          fill:"forwards"
        }
      );

      return animation.finished.catch(()=>{});
    });

    await Promise.all(tasks);
  }

  function showDialog(win) {
    const dialog=$("dialog");

    dialog.innerHTML=win?`
      <h2>2048 兔兔出現喇！</h2>
      <p>合成成功！目前 ${score.toLocaleString()} 分。<br>
        可以繼續挑戰更大的數字。</p>
      <div class="dialog-actions">
        <button class="primary" data-continue>繼續挑戰</button>
        <button data-restart>重新開始</button>
        <a href="games.html">遊戲區</a>
      </div>
    `:`
      <h2>兔兔排滿晒喇！</h2>
      <p>今次 ${score.toLocaleString()} 分。<br>
        已經沒有可以移動或合併的位置，再試一次？</p>
      <div class="dialog-actions">
        <button class="primary" data-restart>再玩一次</button>
        <a href="games.html">返回遊戲區</a>
      </div>
    `;

    if(!dialog.open)dialog.showModal();
  }

  async function move(direction) {
    if(busy||$("dialog").open)return;

    const result=calculate(direction);

    if(!result.changed) {
      if(!hasMoves())showDialog(false);
      return;
    }

    busy=true;
    $("newGame").disabled=true;
    $("board").setAttribute("aria-busy","true");

    try {
      await animateMove(result.movements);

      board=result.next;
      score+=result.gain;
      best=Math.max(best,score);

      const spawned=addTile();

      render(spawned,result.merged);

      say(result.gain
        ? `啵！合埋一齊喇～ +${result.gain} 分`
        : "慢慢排，幫相同兔兔搵返朋友～");

      const newWin=!won&&board.some(value=>value>=2048);
      if(newWin)won=true;

      save();

      if(newWin)showDialog(true);
      else if(!hasMoves())showDialog(false);
    } finally {
      busy=false;
      $("newGame").disabled=false;
      $("board").setAttribute("aria-busy","false");
    }
  }

  function newGame() {
    board=Array(16).fill(0);
    score=0;
    won=false;
    pointer=null;

    addTile();
    const spawned=addTile();
    render(spawned);
    save();
    say("兩隻一樣嘅兔兔碰埋，就會有新朋友呀～");
  }

  const directions={
    ArrowLeft:"left",ArrowRight:"right",
    ArrowUp:"up",ArrowDown:"down"
  };

  document.addEventListener("keydown",event=>{
    if(!(event.key in directions)||$("dialog").open)return;
    event.preventDefault();
    if(!event.repeat)move(directions[event.key]);
  });

  $("board").addEventListener("pointerdown",event=>{
    if(!event.isPrimary||event.button!==0||busy||$("dialog").open)return;

    pointer={
      id:event.pointerId,
      x:event.clientX,
      y:event.clientY
    };

    try{$("board").setPointerCapture(event.pointerId)}catch{}
  });

  $("board").addEventListener("pointerup",event=>{
    if(!pointer||pointer.id!==event.pointerId)return;

    const original=pointer;
    pointer=null;

    try{$("board").releasePointerCapture(event.pointerId)}catch{}

    const dx=event.clientX-original.x;
    const dy=event.clientY-original.y;

    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;

    move(Math.abs(dx)>Math.abs(dy)
      ? dx>0?"right":"left"
      : dy>0?"down":"up");
  });

  $("board").addEventListener("pointercancel",()=>pointer=null);
  window.addEventListener("blur",()=>pointer=null);

  $("newGame").onclick=()=>{
    if(!busy&&confirm("重新開始？目前這一局會被取代。"))newGame();
  };

  $("dialog").addEventListener("click",event=>{
    if(event.target.closest("[data-continue]")) {
      $("dialog").close();
      say("繼續合成！看看能迎接幾大隻兔兔～");
    }

    if(event.target.closest("[data-restart]")) {
      $("dialog").close();
      newGame();
    }
  });

  let resizeTimer;

  window.addEventListener("resize",()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      if(!busy)render();
    },180);
  });

  $("board").querySelector(".cells").innerHTML=
    Array(16).fill('<div class="cell"></div>').join("");

  $("legend").innerHTML=RABBITS.map((rabbit,index)=>{
    const value=2**(index+1);
    return `<div class="legend-item">
      ${rabbitSVG(value)}
      <strong>${value}</strong>
      <small>${rabbit.name}</small>
    </div>`;
  }).join("");

  let restored=false;

  try {
    const data=JSON.parse(localStorage.getItem(KEY));

    if(validSave(data)) {
      board=data.board;
      score=data.score;
      best=Math.max(data.best,score);
      won=data.won;
      restored=true;
    }
  } catch {}

  if(restored) {
    render();
    say("上一局幫你留住咗，繼續慢慢合兔兔～");
    if(!hasMoves())showDialog(false);
  } else {
    newGame();
  }
})();
</script>
</body>
</html>
